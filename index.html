<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1b2f" />
  <title>Swarm Vanguard</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; overscroll-behavior: none; font-family: system-ui, -apple-system, sans-serif; }
    body { display: grid; place-items: center; }
    #stage { position: relative; width: min(100vw, calc(100dvh * 9 / 16)); height: 100dvh; overflow: hidden; background: #8fd3f4; touch-action: none; }
    #hud { position: absolute; inset: 0; pointer-events: none; color: #fff; }
    #top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; }
    #lvl { font-weight: 800; font-size: 14px; text-shadow: 0 2px 4px #000a; }
    #bar { flex: 1; height: 10px; background: #0006; border-radius: 6px; overflow: hidden; }
    #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#ffd23a,#ff8a1f); }
    #mute { pointer-events: auto; width: 34px; height: 34px; border-radius: 50%; border: 0; background: #0006; color: #fff; font-size: 16px; }
    #boss { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); width: 62%; display: none; align-items: center; gap: 8px; font-weight: 900; font-size: 13px; text-shadow: 0 2px 4px #000a; }
    #boss.show { display: flex; }
    #boss .bb { flex: 1; height: 14px; border-radius: 8px; background: #0008; overflow: hidden; border: 2px solid #fff6; }
    #boss .bb i { display: block; height: 100%; width: 100%; background: linear-gradient(#ff5a5a,#c21f1f); transition: width .08s; }
    #weapon { position: absolute; left: 12px; bottom: 14px; padding: 4px 10px; border-radius: 10px; background: #0007; font-weight: 900; font-size: 13px; letter-spacing: 1px; color: #ffe27a; }
    #banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; font-weight: 900; font-size: 30px; letter-spacing: 2px; color: #fff; -webkit-text-stroke: 5px #7a0f0f; paint-order: stroke fill; text-shadow: 0 4px 0 #3a0808; opacity: 0; pointer-events: none; }
    #banner small { display: block; font-size: 15px; letter-spacing: 3px; color: #ffd23a; -webkit-text-stroke: 4px #3a0808; margin-bottom: 4px; }
    #banner.show { animation: banner 2.4s ease-out forwards; }
    @keyframes banner { 0% { opacity: 0; transform: scale(2.2); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(0.96) translateY(-16px); } }
    #hint { position: absolute; left: 0; right: 0; bottom: 120px; display: none; flex-direction: column; align-items: center; gap: 6px; color: #fff; font-weight: 900; letter-spacing: 2px; font-size: 15px; text-shadow: 0 2px 6px #000a; pointer-events: none; }
    #hint.show { display: flex; }
    #hint .hand { font-size: 46px; animation: swipe 1.6s ease-in-out infinite; }
    @keyframes swipe { 0%, 100% { transform: translateX(-60px) rotate(-8deg); } 50% { transform: translateX(60px) rotate(8deg); } }
    #toggles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .tg { border: 2px solid #ffffff44; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 800; color: #fff; background: #ffffff14; }
    .tg.on { background: #3aa65a; border-color: #7be39a; }
    #count { position: absolute; transform: translate(-50%, -100%); font-weight: 900; font-size: 26px; color: #fff; -webkit-text-stroke: 4px #1b3a8a; paint-order: stroke fill; text-shadow: 0 3px 0 #1b3a8a; white-space: nowrap; }
    .pop { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 22px; color: #ffe27a; -webkit-text-stroke: 4px #000a; paint-order: stroke fill; animation: pop 0.9s ease-out forwards; white-space: nowrap; }
    @keyframes pop { from { opacity: 1; transform: translate(-50%, -50%) scale(0.8); } to { opacity: 0; transform: translate(-50%, -160%) scale(1.3); } }
    .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000a; pointer-events: auto; text-align: center; padding: 24px; color: #fff; }
    .overlay.show { display: flex; }
    .overlay h1 { margin: 0; font-size: 40px; text-shadow: 0 4px 0 #0008; }
    .overlay p { margin: 0; opacity: 0.85; }
    #coins { font-weight: 800; color: #ffe27a; }
    #levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 330px; }
    .lv { border: 0; border-radius: 12px; padding: 8px 0 6px; font-weight: 900; font-size: 18px; color: #fff; background: #3558c8; box-shadow: 0 3px 0 #1d3380; }
    .lv small { display: block; font-size: 11px; letter-spacing: 1px; color: #ffe27a; min-height: 14px; }
    .lv.sel { background: #ffb21f; color: #1b1b2f; box-shadow: 0 3px 0 #a86a00; }
    .lv.sel small { color: #7a4a00; }
    .lv:disabled { background: #444a5c; box-shadow: 0 3px 0 #2a2e3b; color: #9aa; }
    #stars { font-size: 38px; letter-spacing: 6px; color: #ffd23a; text-shadow: 0 3px 0 #0008; min-height: 46px; }
    .btn.ghost { background: #ffffff22; color: #fff; box-shadow: none; font-size: 16px; padding: 10px 24px; }
    .btn { border: 0; border-radius: 14px; padding: 14px 34px; font-size: 20px; font-weight: 800; color: #1b1b2f; background: linear-gradient(#ffe27a,#ffb21f); box-shadow: 0 4px 0 #a86a00; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="hud">
      <div id="top"><span id="lvl">LEVEL 1</span><div id="bar"><i></i></div><button id="mute" aria-label="Mute">🔊</button></div>
      <div id="boss"><span>BOSS</span><div class="bb"><i></i></div><b id="bossHp"></b></div>
      <div id="weapon">RIFLE</div>
      <div id="banner"></div>
      <div id="hint"><div class="hand">👆</div><span>DRAG TO STEER</span></div>
      <div id="count">0</div>
    </div>
    <div class="overlay show" id="start"><h1>SWARM VANGUARD</h1><p>Drag to steer. Shoot blocks, pick gates, grow your squad.</p><div id="coins"></div><div id="levels"></div><div id="toggles"></div><button class="btn" id="startBtn">Tap to start</button></div>
    <div class="overlay" id="end"><h1 id="endTitle"></h1><div id="stars"></div><p id="endText"></p><button class="btn" id="endBtn">Retry</button><button class="btn ghost" id="menuBtn">Level select</button></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
